apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: envoy-require-client-ca.static.k8s.io
spec:
  failurePolicy: Fail
  matchConditions:
  - name: envoy-namespace
    expression: request.namespace == 'envoy-gateway-system'
  - name: application-client-ca
    expression: request.name == 'gateway-client-ca' || (request.operation == 'DELETE' && request.name == '')
  matchConstraints:
    resourceRules:
    - apiGroups: [ "" ]
      apiVersions: [ "*" ]
      operations: [ CREATE, UPDATE, DELETE ]
      resources: [ secrets ]
  variables:
  - name: approvedCA
    expression: "''"
  validations:
  - expression: >-
      request.operation != 'DELETE' && object.type == 'Opaque' && object.data == {'ca.crt': variables.approvedCA}
    message: gateway-client-ca must contain only the approved public application CA bundle; deletion is forbidden.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: envoy-require-client-ca.static.k8s.io
spec:
  policyName: envoy-require-client-ca.static.k8s.io
  validationActions: [ Deny ]
